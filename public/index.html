<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Gezgin Günlüğü</title>

    <!-- ANA EKRANA EKLEME (PWA).
         Fotoğraflar tarayıcının IndexedDB'sinde tutuluyor ve tarayıcı bunu
         "best-effort" sayarsa silebiliyor: iOS Safari, siteye 7 gün girilmezse
         script ile yazılmış tüm veriyi temizler. Ana ekrana eklenmiş (standalone)
         bir web uygulamasının verisi bu temizlikten muaf tutulur ve kalıcı
         depolama izni de genellikle verilir. Bu etiketler o yüzden burada. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gezgin Günlüğü" />
    <meta name="application-name" content="Gezgin Günlüğü" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta
      name="description"
      content="Seyahat notu, günlük program, harcama takibi, dijital albüm ve video kolaj asistanı."
    />

    <!-- `react-native-web` önerilen stil sıfırlaması:
         https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* Gövde tam yükseklik olsun */
      html,
      body {
        height: 100%;
      }
      /* <ScrollView> kullanıldığı için gövde kaydırması kapalı */
      body {
        overflow: hidden;
      }
      /* Kök öğe tam yükseklik */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Bu uygulamayı çalıştırmak için JavaScript'i etkinleştirmelisiniz.</noscript>
    <div id="root"></div>
  </body>
</html>
